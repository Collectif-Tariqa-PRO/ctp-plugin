  <p style="font-family:'Oswald', Arial, sans-serif; font-size:50px; font-weight:500; text-transform:uppercase; line-height:1.18; text-align:center; color:#FFFFFF">« Le Diable vous promet la pauvreté et vous ordonne la turpitude, tandis qu'Allah vous promet pardon et grâce de Sa part. »</p>

  <p style="font-family:'Noto Naskh Arabic', Georgia, serif; font-size:48px; line-height:1.9; text-align:center; color:#FFFFFF">﴿ الشَّيْطَانُ يَعِدُكُمُ الْفَقْرَ وَيَأْمُرُكُم بِالْفَحْشَاءِ ۖ وَاللَّهُ يَعِدُكُم مَّغْفِرَةً مِّنْهُ وَفَضْلًا ﴾</p>
