  <p style="font-family:'Archivo', Arial, sans-serif; font-size:40px; font-weight:900; font-style:italic; text-transform:uppercase; line-height:1.14; color:#FFFFFF">Il arrive à Médine après l'exil. Il n'a plus rien.</p>
  <div style="width:180px; height:4px; background:#E3A94F"></div>
  <div style="display:flex; flex-direction:column; gap:20px">
    <p style="font-family:'Poppins', Arial, sans-serif; font-size:38px; font-weight:400; line-height:1.42; color:#FFFFFF">Saʿd ibn ar-Rabīʿ lui propose la moitié de sa fortune</p>
    <p style="font-family:'Poppins', Arial, sans-serif; font-size:38px; font-weight:400; line-height:1.42; color:#FFFFFF">Il refuse</p>
    <p style="font-family:'Poppins', Arial, sans-serif; font-size:38px; font-weight:400; line-height:1.42; color:#FFFFFF">« Que Dieu te bénisse dans ta famille et tes biens — indiquez-moi seulement le marché »</p>
    <p style="font-family:'Poppins', Arial, sans-serif; font-size:38px; font-weight:400; line-height:1.42; color:#FFFFFF">Il achète du beurre clarifié et du fromage sec. Et il reconstruit.</p>
