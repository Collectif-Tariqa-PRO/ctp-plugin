  <p style="font-family:'Oswald', Arial, sans-serif; font-size:50px; font-weight:500; text-transform:uppercase; line-height:1.18; text-align:center; color:#FFFFFF">Un martyr. Un savant qui a enseigné. Un riche qui a beaucoup donné. Trois résultats spectaculaires. Les trois sont rejetés. « Ils l'ont fait pour qu'on le dise. Et on l'a dit. »</p>
