  <p style="font-family:'Poppins', Arial, sans-serif; font-size:54px; font-weight:400; line-height:1.34; text-align:center; color:#FFFFFF">« Je ne veux pas me mettre en avant. »</p>
  <p style="font-family:'Poppins', Arial, sans-serif; font-size:54px; font-weight:400; line-height:1.34; text-align:center; color:#FFFFFF">Vérifie que c'est de l'humilité,</p>
  <p style="font-family:'Poppins', Arial, sans-serif; font-size:54px; font-weight:400; line-height:1.34; text-align:center; color:#E3A94F">et pas une peur qui a trouvé un joli nom.</p>
  <aside>À dire avec douceur : beaucoup de gens sincères se cachent derrière la pudeur. La question n'est pas de se montrer, c'est de se rendre trouvable par ceux qui te cherchent déjà.</aside>
